name: Issue 32 arm64 startup smoke
on:
  push:
    branches: ["diagnostic/issue-32-mac-arm64"]
    paths: [".github/workflows/issue32-mac-smoke.yml", "scripts/issue32/**"]
permissions:
  contents: read
jobs:
  mac-arm64:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.3"
      - name: Install pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(node -p process.arch)" = arm64
          target="$RUNNER_TEMP/issue32"
          mkdir -p "$target/evidence" "$target/version-agent" "$target/version-home"
          npm install --prefix "$target" --ignore-scripts --no-audit --no-fund --save-exact @earendil-works/pi-coding-agent@1.5.2 @maxiaochao/pi-herdr-subagents@0.10.1
          curl --fail --show-error --silent --location --retry 3 --max-time 120 https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-macos-aarch64 --output "$target/herdr"
          chmod 755 "$target/herdr"
          "$target/herdr" --version | grep -Fx "herdr 0.9.5"
          HOME="$target/version-home" PI_CODING_AGENT_DIR="$target/version-agent" "$target/node_modules/.bin/pi" --version | grep -Fx "1.5.2"
      - name: Candidate deterministic contracts
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/issue32"
          mkdir -p "$target/test-home" "$target/test-agent"
          export HOME="$target/test-home" PI_CODING_AGENT_DIR="$target/test-agent"
          export PI_TEST_BINARY="$target/node_modules/.bin/pi"
          export PATH="$target/node_modules/.bin:$PATH"
          npm --prefix packages/herdr-subagents test
      - name: Baseline published 0.10.1 Mac smoke (known failing control)
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/issue32"
          export PATH="$target/node_modules/.bin:$PATH"
          # Node does not strip TypeScript under node_modules. Use unchanged npm files.
          cp -R "$target/node_modules/@maxiaochao/pi-herdr-subagents" "$target/released-package"
          if python3 scripts/issue32/pty-run.py "$target/herdr" "$target/released-package" "$target/evidence/baseline.json"; then
            echo "Expected published 0.10.1 baseline to reproduce issue 32"
            exit 1
          fi
          node - "$target/evidence/baseline.json" <<'NODE'
          const assert = require("node:assert/strict");
          const trace = JSON.parse(require("node:fs").readFileSync(process.argv[2], "utf8"));
          for (const n of [1,2,3]) {
            const events = trace.filter(x => x.round === n);
            const start = events.find(x => x.kind === "start");
            const probe = events.find(x => x.kind === "probe");
            const classified = events.find(x => x.event === "isTaskRunning-end");
            const settled = events.find(x => x.event === "settled");
            assert(start?.ready && start.status === "idle");
            assert(probe?.foreground.some(p => p.name === "node" && p.argv0 === "pi" && p.argvCount === 0));
            assert.equal(classified?.alive, false);
            assert.equal(settled?.error, "Child Pi exited without submitting a subagent_report.");
            assert.equal(settled?.requests, 0);
            assert.equal(settled?.attemptIdPresent, false);
          }
          console.log("Published baseline reproduced the exact issue 32 classifier failure in 3/3 rounds");
          NODE
      - name: Candidate Mac smoke (two-gate refactor)
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/issue32"
          export PATH="$target/node_modules/.bin:$PATH"
          cp -R "$GITHUB_WORKSPACE/packages/herdr-subagents" "$target/candidate-package"
          python3 scripts/issue32/pty-run.py "$target/herdr" "$target/candidate-package" "$target/evidence/candidate.json"
      - name: Validate both release tarballs and run real concurrent Herdr acceptance
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/issue32"
          release="$target/release-tree"
          mkdir -p "$release" "$target/release-launch"
          git archive HEAD | tar -x -C "$release"
          cp scripts/issue32/pty-run.py "$target/release-launch/pty-run.py"
          cp scripts/ci-issue32/smoke.mjs "$target/release-launch/smoke.mjs"
          export PATH="$target/node_modules/.bin:$PATH"
          (
            cd "$release"
            npm --prefix packages/herdr-subagents version patch --no-git-tag-version
            npm version patch --no-git-tag-version
            test "$(node -p "require('./package.json').version")" = "0.15.4"
            test "$(node -p "require('./packages/herdr-subagents/package.json').version")" = "0.10.2"
            note='Recognize Pi from Herdr’s macOS argv0 when full argv is unavailable, and retain the attempt ID if startup fails.'
            node scripts/update-release-changelog.mjs packages/herdr-subagents/CHANGELOG.md 0.10.2 "$note"
            node scripts/update-release-changelog.mjs CHANGELOG.md 0.15.4 "herdr-subagents v0.10.2: $note"
          )
          python3 "$target/release-launch/pty-run.py" "$target/herdr" "$release/packages/herdr-subagents" "$target/evidence/release-preflight.json"
      - name: Print redacted synthetic evidence
        if: always()
        shell: bash
        run: |
          for label in baseline candidate release-preflight; do
            evidence="$RUNNER_TEMP/issue32/evidence/$label.json"
            if [[ -f "$evidence" ]]; then echo "$label JSON"; cat "$evidence"; echo; fi
          done
      - name: Upload synthetic startup evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: issue32-arm64-baseline-and-candidate
          path: ${{ runner.temp }}/issue32/evidence/
          if-no-files-found: ignore
          retention-days: 3
