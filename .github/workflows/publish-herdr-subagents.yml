name: publish herdr subagents

on:
  push:
    tags:
      - "herdr-subagents-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          scope: ""
      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/herdr-subagents/package.json').version")
          test "$GITHUB_REF_NAME" = "herdr-subagents-v$PACKAGE_VERSION"
      - name: Run Herdr Subagents tests
        run: npm test --prefix packages/herdr-subagents
      - name: Publish Herdr Subagents to npm
        working-directory: packages/herdr-subagents
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
