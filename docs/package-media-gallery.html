<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pi-toolkit package media</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #10141c; color: #e8edf5; }
    body { max-width: 1500px; margin: auto; padding: 2rem; }
    h1 { margin-bottom: .25rem; }
    section { margin: 2rem 0; padding: 1.25rem; border: 1px solid #334155; border-radius: 12px; background: #171d28; }
    .media { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); gap: 1rem; }
    figure { margin: 0; }
    img { display: block; width: 100%; height: auto; border: 1px solid #475569; border-radius: 8px; background: #0b0f16; }
    figcaption { margin: .5rem 0; color: #aeb9ca; }
    a { color: #78b7ff; }
  </style>
</head>
<body>
  <h1>pi-toolkit package media</h1>
  <p>Real output regenerated by <code>node scripts/capture-package-media.mjs</code>. Select an image to inspect the original file.</p>
  <main>
    <section><h2>Todo</h2><div class="media">
      <figure><figcaption>Screenshot</figcaption><a href="../packages/todo/docs/screenshot.png"><img src="../packages/todo/docs/screenshot.png" alt="Todo session state screenshot"></a></figure>
      <figure><figcaption>Demo</figcaption><a href="../packages/todo/docs/demo.gif"><img src="../packages/todo/docs/demo.gif" alt="Todo state transition demo"></a></figure>
    </div></section>
    <section><h2>Cache Export</h2><div class="media">
      <figure><figcaption>Full dashboard screenshot</figcaption><a href="../packages/cache-export/docs/screenshot.png"><img src="../packages/cache-export/docs/screenshot.png" alt="Cache Export dashboard screenshot"></a></figure>
      <figure><figcaption>Dashboard demo</figcaption><a href="../packages/cache-export/docs/demo.gif"><img src="../packages/cache-export/docs/demo.gif" alt="Cache Export dashboard demo"></a></figure>
    </div></section>
    <section><h2>Codex Edit</h2><div class="media">
      <figure><figcaption>Screenshot</figcaption><a href="../packages/codex-edit/docs/screenshot.png"><img src="../packages/codex-edit/docs/screenshot.png" alt="Codex Edit apply_patch screenshot"></a></figure>
      <figure><figcaption>Demo</figcaption><a href="../packages/codex-edit/docs/demo.gif"><img src="../packages/codex-edit/docs/demo.gif" alt="Codex Edit patch application demo"></a></figure>
    </div></section>
    <section><h2>Herdr Subagents</h2><div class="media">
      <figure><figcaption>Screenshot</figcaption><a href="../packages/herdr-subagents/docs/screenshot.png"><img src="../packages/herdr-subagents/docs/screenshot.png" alt="Herdr Subagents process screenshot"></a></figure>
      <figure><figcaption>Demo</figcaption><a href="../packages/herdr-subagents/docs/demo.gif"><img src="../packages/herdr-subagents/docs/demo.gif" alt="Herdr Subagents process demo"></a></figure>
    </div></section>
    <section><h2>Worktree</h2><div class="media">
      <figure><figcaption>Screenshot</figcaption><a href="../packages/worktree/docs/screenshot.png"><img src="../packages/worktree/docs/screenshot.png" alt="Worktree CLI screenshot"></a></figure>
      <figure><figcaption>Demo</figcaption><a href="../packages/worktree/docs/demo.gif"><img src="../packages/worktree/docs/demo.gif" alt="Worktree CLI demo"></a></figure>
    </div></section>
  </main>
</body>
</html>
